# =============================================================================
# Data contract: bronze.raw_financial_facts
# -----------------------------------------------------------------------------
# A data contract is a promise from the producer (ingestion) to consumers
# (dbt, detection, dashboard) about shape and quality. It is EXECUTED by
# quality/check_contracts.py on every pipeline run and in CI: any rule with
# level "error" that fails stops the pipeline before bad data reaches gold.
# =============================================================================
kind: DataContract
metadata:
  name: raw-financial-facts
  version: 2.0.0
  owner: pipeline maintainer (solo self-directed project)
  description: >
    XBRL facts from the SEC EDGAR companyfacts endpoint, one row per fact
    as reported in one filing.

table: bronze.raw_financial_facts

columns:
  - {name: fact_key,         type: VARCHAR, nullable: false, unique: true}
  - {name: cik,              type: VARCHAR, nullable: false, pattern: "^[0-9]{10}$"}
  - {name: taxonomy,         type: VARCHAR, nullable: false, allowed_values: ["us-gaap", "dei"]}
  - {name: metric,           type: VARCHAR, nullable: false}
  - {name: unit,             type: VARCHAR, nullable: false}
  - {name: period_start,     type: DATE,    nullable: true}
  - {name: period_end,       type: DATE,    nullable: false}
  - {name: value,            type: DOUBLE,  nullable: true}
  - {name: filed_date,       type: DATE,    nullable: false}
  - {name: accession_number, type: VARCHAR, nullable: false, pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"}
  - {name: ingested_at,      type: TIMESTAMP, nullable: false}

rules:
  - name: period_order
    level: error
    condition: "period_start IS NULL OR period_end >= period_start"
    description: A period cannot end before it starts.

  - name: filed_after_period
    level: error
    condition: "filed_date >= period_end - INTERVAL 400 DAY"
    description: >
      Facts are filed after the period they describe. Cover-page facts
      (shares outstanding) are dated close to the filing, so a generous window is used.

  - name: value_present
    level: warn
    max_failure_rate: 0.01
    condition: "value IS NOT NULL"
    description: Almost every fact has a value.

  - name: usd_magnitude
    level: warn
    max_failure_rate: 0.001
    condition: "unit <> 'USD' OR abs(value) < 1e13"
    description: No single dollar figure above $10 trillion (catches unit errors).

volume:
  min_rows: 100

freshness:
  column: ingested_at
  max_age_hours: 30
  description: Daily schedule plus a 6-hour grace period.
