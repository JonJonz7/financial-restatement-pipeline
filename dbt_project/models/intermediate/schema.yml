version: 2

models:
  - name: int_filing_comparisons
    description: Every change of a fact's value between consecutive filings.
    columns:
      - name: restated_value
        tests: [not_null]
      - name: original_value
        tests: [not_null]

  - name: int_balance_sheet_checks
    description: Filings where Assets does not equal Liabilities + Equity.

  - name: int_quarterly_revenue
    description: One revenue figure per company-quarter (latest version; Q4 derived when untagged).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cik, period_end]

  - name: int_scale_checks
    description: Quarters whose revenue is under 5% or over 20x the company's median quarter.

  - name: int_market_valuation
    description: Market cap and price-to-sales per company-quarter with a robust z-score.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cik, period_end]
    columns:
      - name: market_cap
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
