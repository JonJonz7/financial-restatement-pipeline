version: 2

sources:
  - name: bronze
    description: Raw rows loaded by ingestion/loader.py. Never edited by hand.
    schema: bronze
    tables:
      - name: raw_companies
        columns:
          - name: cik
            tests: [not_null, unique]
      - name: raw_filings
        columns:
          - name: accession_number
            tests: [not_null, unique]
          - name: cik
            tests: [not_null]
      - name: raw_financial_facts
        loaded_at_field: ingested_at
        columns:
          - name: fact_key
            tests: [not_null, unique]
          - name: period_end
            tests: [not_null]
      - name: raw_market_data
        columns:
          - name: ticker
            tests: [not_null]
      - name: ingestion_runs
        description: Lineage. One row per source document loaded, with its SHA-256.

models:
  - name: stg_companies
    description: Company profile from SEC submissions. One row per CIK.
    columns:
      - name: cik
        tests: [not_null, unique]

  - name: stg_filings
    description: Filing index. One row per accession number.
    columns:
      - name: accession_number
        tests: [not_null, unique]
      - name: form_type
        tests:
          - accepted_values:
              values: ["10-K", "10-K/A", "10-Q", "10-Q/A"]
      - name: cik
        tests:
          - relationships:
              to: ref('stg_companies')
              field: cik

  - name: stg_financial_facts
    description: One XBRL fact as reported in one filing.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cik, taxonomy, metric, unit, period_start, period_end, accession_number]
    columns:
      - name: fact_key
        tests: [not_null, unique]
      - name: period_type
        tests:
          - accepted_values:
              values: ["instant", "quarter", "year", "other"]

  - name: stg_market_data
    description: Daily prices. One row per ticker per trading day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, trade_date]
    columns:
      - name: close_price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
