version: 2

models:
  - name: dim_companies
    description: One row per company with filing activity.
    columns:
      - name: cik
        tests: [not_null, unique]

  - name: dim_filing_periods
    columns:
      - name: period_key
        tests: [not_null, unique]

  - name: fct_restatements
    description: Detected restatements (value changed between filings) with severity and type.
    columns:
      - name: restatement_id
        tests: [not_null, unique]
      - name: severity
        tests:
          - not_null
          - accepted_values:
              values: ["MATERIAL", "NOTABLE", "MINOR"]
      - name: restatement_type
        tests:
          - accepted_values:
              values: ["AMENDMENT", "RECAST"]
      - name: days_to_restatement
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: cik
        tests:
          - relationships:
              to: ref('dim_companies')
              field: cik

  - name: fct_anomalies
    description: All detected issues in one shape. Scored downstream into gold.alerts.
    columns:
      - name: anomaly_id
        tests: [not_null, unique]
      - name: anomaly_type
        tests:
          - accepted_values:
              values: ["RESTATEMENT", "BALANCE_SHEET_BREAK", "SCALE_ERROR", "VALUATION_OUTLIER"]
      - name: severity
        tests:
          - not_null
          - accepted_values:
              values: ["MATERIAL", "NOTABLE", "MINOR"]
