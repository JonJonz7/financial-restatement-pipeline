###############################################################################
# Deploy (manual only): Terraform plan/apply for the GCP design in terraform/.
#
# Status: NOT deployed. This project runs locally on DuckDB. The workflow is
# kept so the deployment path is real and reviewable: it refuses to run until
# the GCP secrets exist, and apply needs a human approval on the "production"
# environment. See docs/ROADMAP.md for what is still missing (the Cloud
# Function entry point and a BigQuery dbt target).
###############################################################################
name: Deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (otherwise plan only)"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC to GCP: no long-lived keys stored in GitHub
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require GCP configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
        run: |
          missing=""
          for v in GCP_PROJECT_ID WIF_PROVIDER GCP_SA_EMAIL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Nothing to deploy to."
            exit 1
          fi

  terraform:
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - run: terraform init
      - run: terraform plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -out=tfplan
      - if: ${{ inputs.apply }}
        run: terraform apply -auto-approve tfplan
