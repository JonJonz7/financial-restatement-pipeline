###############################################################################
# CI: runs on every push and pull request.
#   test       lint + unit/integration tests (incl. a real dbt build on sample data)
#   demo       the full pipeline on bundled sample data; uploads the alert report
#   terraform  fmt + validate the GCP design (no cloud credentials needed)
#   audit      dependency vulnerability report (informational, never blocks)
###############################################################################
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check ingestion detection quality dags tests scripts dashboard
          ruff format --check ingestion detection quality dags tests scripts dashboard
      - name: Tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  demo:
    name: Pipeline on sample data
    runs-on: ubuntu-latest
    needs: test
    env:
      WAREHOUSE_DB_PATH: ${{ github.workspace }}/demo.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load sample data into bronze
        run: python -m ingestion.demo
      - name: Data contracts
        run: python -m quality.check_contracts
      - name: Great Expectations
        run: python -m quality.run_expectations
      - name: dbt build (models + 45 tests)
        working-directory: dbt_project
        run: |
          dbt deps --profiles-dir . --project-dir .
          dbt build --profiles-dir . --project-dir .
      - name: Score alerts
        run: python -m detection.run --report reports/demo_alerts.md
      - name: Publish report to the job summary
        run: cat reports/demo_alerts.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-alert-report
          path: reports/demo_alerts.md

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --desc on || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t frp:ci .
      - name: Run the demo inside the image
        run: |
          docker run --rm -e WAREHOUSE_DB_PATH=/tmp/demo.duckdb frp:ci sh -c \
            "python -m ingestion.demo && cd dbt_project && dbt build --profiles-dir . --project-dir . && cd .. && python -m detection.run --report /tmp/alerts.md"
