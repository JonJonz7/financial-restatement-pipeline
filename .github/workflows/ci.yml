###############################################################################
# CI — Financial Restatement Pipeline
# --------------------------------------------------------------------------
# Runs on every push to main and on all pull requests.
# Jobs: test (pytest + dbt), quality (Great Expectations), security (safety).
###############################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DUCKDB_PATH: "warehouse.duckdb"

jobs:
  # -------------------------------------------------------------------------
  # Test — unit tests, dbt compile & test, linting
  # -------------------------------------------------------------------------
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: |
          ruff check ingestion/ detection/ dags/ tests/
          ruff format --check ingestion/ detection/ dags/ tests/

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps --profiles-dir . --project-dir .

      - name: dbt compile
        working-directory: dbt_project
        run: dbt compile --profiles-dir . --project-dir .

      - name: dbt seed
        working-directory: dbt_project
        run: dbt seed --profiles-dir . --project-dir .

      - name: dbt test
        working-directory: dbt_project
        run: dbt test --profiles-dir . --project-dir .

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # -------------------------------------------------------------------------
  # Quality — Great Expectations checkpoint
  # -------------------------------------------------------------------------
  quality:
    name: Data Quality
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed test data
        working-directory: dbt_project
        run: |
          dbt deps --profiles-dir . --project-dir .
          dbt seed --profiles-dir . --project-dir .

      - name: Run Great Expectations checkpoint
        run: |
          cd quality/great_expectations
          great_expectations checkpoint run filing_checkpoint || echo "::warning::GE checkpoint not yet configured — skipping"

  # -------------------------------------------------------------------------
  # Security — dependency vulnerability scan
  # -------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        run: safety check -r requirements.txt --output json || true
        # Non-blocking: log vulnerabilities but don't fail the build
        # (known issues in transitive deps shouldn't block development)
